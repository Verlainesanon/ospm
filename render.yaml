services:
  - type: web
    name: ospm
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run db:seed && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Playwright ne sert qu'aux scripts d'audit visuel, en local. Sans cette
      # variable, son installation telecharge ~200 Mo de navigateurs a chaque
      # build — inutile ici, et de quoi saturer le disque de l'offre gratuite.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ospm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OSPM_AGENT_TOKEN
        generateValue: true

databases:
  - name: ospm-db
    plan: free
    databaseName: ospm
    region: frankfurt
