services:
  - type: web
    name: ospm
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: ospm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OSPM_AGENT_TOKEN
        generateValue: true
      - key: OSPM_URL
        fromService:
          name: ospm
          type: web
          property: host

databases:
  - name: ospm-db
    plan: free
    databaseName: ospm
    region: frankfurt
